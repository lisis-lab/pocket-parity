<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisis Lab</title>
<meta name="description" content="Useful money tools built on official price and inflation data.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root{--paper:#eef2f1;--card:#fff;--ink:#122236;--muted:#5a6b7c;--line:#d3dcdf;--accent:#1f5fd6}
@media (prefers-color-scheme:dark){:root{--paper:#0e1620;--card:#16212d;--ink:#e6edf3;--muted:#93a4b5;--line:#2a3846;--accent:#6f9cff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;padding:40px max(16px,env(safe-area-inset-left,0px))}
main{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font:800 clamp(32px,6vw,48px)/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1 span{color:var(--accent)}
p{color:var(--muted);margin:8px 0 0;max-width:60ch}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
a.tool{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;color:inherit;text-decoration:none}
a.tool:hover,a.tool:focus-visible{border-color:var(--accent);outline:none}
a.tool strong{font:700 20px "Bricolage Grotesque",system-ui,sans-serif}
a.tool span{color:var(--muted);font-size:14px}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Lisis<span>Lab</span></h1>
    <p>Money tools built on official price and inflation data, with the method written out.</p>
  </header>
  <section class="tools">
    <a class="tool" href="pocket-parity/">
      <strong>Pocket Parity</strong>
      <span>See what your travel money really buys abroad, by spending category.</span>
    </a>
  </section>
  <footer>Lisis Lab · more tools coming.</footer>
</main>
</body>
</html>
